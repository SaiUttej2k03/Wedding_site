<section id="wishes" class="py-24 px-6 max-w-5xl mx-auto">
  <div class="text-center mb-16">
    <span class="font-cinzel text-xs tracking-[0.3em] uppercase text-regal-gold">Blessing Wall</span>
    <h2 class="font-cormorant text-4xl sm:text-6xl font-bold gold-gradient-text mt-2">Leave Your Blessings</h2>
    <div class="w-24 h-0.5 bg-regal-gold/40 mx-auto mt-4"></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    <div class="lg:col-span-7">
      <div id="blessings-feed" class="space-y-4">
        <div class="regal-card p-6 rounded-2xl border-regal-gold/50 border">
          <div class="flex justify-between items-center mb-2">
            <h5 class="font-cormorant text-xl font-bold text-regal-gold">Auntie Neha</h5>
            <span class="text-[10px] uppercase tracking-widest text-regal-sand/70">Mumbai</span>
          </div>
          <p class="text-xs sm:text-sm text-regal-cream/90 leading-relaxed italic">“May your home always be filled with laughter, peace, and endless love.”</p>
        </div>
        <div class="regal-card p-6 rounded-2xl border-regal-gold/50 border">
          <div class="flex justify-between items-center mb-2">
            <h5 class="font-cormorant text-xl font-bold text-regal-gold">Rohan</h5>
            <span class="text-[10px] uppercase tracking-widest text-regal-sand/70">Bengaluru</span>
          </div>
          <p class="text-xs sm:text-sm text-regal-cream/90 leading-relaxed italic">“Wishing you both a beautiful journey together, filled with happiness and gratitude.”</p>
        </div>
      </div>
    </div>

    <div class="lg:col-span-5">
      <form id="blessing-form" class="regal-card p-6 rounded-3xl border border-regal-gold/50">
        <h3 class="font-cormorant text-3xl text-regal-gold font-bold mb-4">Send Your Wishes</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-regal-sand mb-2">Your Name</label>
            <input id="blessing-name" type="text" class="w-full rounded-xl border border-regal-gold/30 bg-regal-emerald/50 px-4 py-3 text-sm text-regal-cream focus:outline-none focus:border-regal-gold" required />
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-regal-sand mb-2">City</label>
            <input id="blessing-city" type="text" class="w-full rounded-xl border border-regal-gold/30 bg-regal-emerald/50 px-4 py-3 text-sm text-regal-cream focus:outline-none focus:border-regal-gold" />
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-regal-sand mb-2">Blessings</label>
            <textarea id="blessing-text" rows="4" class="w-full rounded-xl border border-regal-gold/30 bg-regal-emerald/50 px-4 py-3 text-sm text-regal-cream focus:outline-none focus:border-regal-gold" required></textarea>
          </div>
          <button type="submit" class="w-full px-6 py-3 rounded-full bg-gradient-to-r from-regal-goldDark to-regal-gold text-regal-emerald font-semibold uppercase text-xs tracking-widest shadow-xl transition">Send Blessing</button>
        </div>
      </form>
    </div>
  </div>
</section>
